
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Awareness Demo</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      width: min(320px, 85%);
      box-shadow: 0 4px 20px #0001;
    }

    h2 {
      color: #1d4ed8;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }

    input {
      border: 1px solid #cbd5e1;
    }

    button {
      background: #1d4ed8;
      color: white;
      border: none;
      cursor: pointer;
    }

    #message {
      margin-top: 18px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>Security Awareness</h2>
    <p>This is a training demo, not a real login page.</p>

    <form id="demoForm">
      <input
        type="text"
        placeholder="Demo username (optional)"
        autocomplete="off"
      />

      <button type="submit">Check this demo</button>
    </form>

    <p id="message" role="status"></p>
  </main>

  <script>
    document
      .getElementById("demoForm")
      .addEventListener("submit", function (event) {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Training lesson: Always verify the website address. " +
          "Never enter passwords on an unfamiliar page.";
      });
  </script>
</body>
</html>
